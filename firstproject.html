<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Listings</title>
    <style>
        * {
            margin: 4px;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            margin: 20px auto;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
        }

        .search-bar {
            width: 100%;
            margin-bottom: 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            background: white;
        }

        .job-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .job-card {
            display: flex;
            align-items: center;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0px 2px 5px 5px rgba(0, 0, 0, 0.1);
            transition: 0.3s;
            width: 100%;
            justify-content: space-between;
        }

        .job-card:hover {
            transform: scale(1.02);
        }

        .job-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
        }

        .logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 15px;
        }

        .logo-black { background: black; }
        .logo-orange { background: orange; }
        .logo-purple { background: purple; }
        .logo-gray { background: gray; }
        .logo-magenta { background: magenta; }
        .logo-green { background: green; }
        .logo-blue { background: blue; }

        .job-info h3 {
            font-size: 18px;
            margin-bottom: 5px;
            margin-top: 10px;
        }

        .job-info p {
            font-size: 14px;
            color: #555;
        }

        .tags {
            display: flex;
            gap: 8px;
            margin-left: auto;
            flex-wrap: nowrap;
        }

        .tags span {
            display: inline-block;
            background: #ddd;
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 5px;
        }

        .badges {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            align-items: center;
            top: 10px;
            left: 15px;
            z-index: 2;
        }

        .badge {
            background: #5c6bc0;
            color: white;
            font-size: 7px;
            padding: 3px 8px;
            border-radius: 12px;
            font-weight: bold;
        }

        .badge-new { background: #ff9800; }
        .badge-featured { background: #d32f2f; }

        img {
            width: 300px;
            height: auto;
        }

        .form-container {
            margin-bottom: 20px;
        }

        .form-container input,
        .form-container select {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-container button {
            padding: 12px 20px;
            font-size: 16px;
            background: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .form-container button:hover {
            background: #45a049;
        }
    </style>
</head>
<body>
<div class="container">

    <div class="search-bar">
        <input type="text" id="search-bar" placeholder="Search Jobs">
    </div>


    <div class="job-list" id="job-list"></div>

    <div class="form-container">
        <h2>Add a Job</h2>
        <input type="text" id="job-title" placeholder="Job Title" required>
        <input type="text" id="job-location" placeholder="Location" required>
        <select id="job-employment">
            <option value="Full Time">Full Time</option>
            <option value="Part Time">Part Time</option>
        </select>
        <input type="text" id="job-skills" placeholder="Required Skills (comma-separated)" required>
        <button onclick="addJob()">Add Job</button>
    </div>
</div>

<script src="index.js"></script>
</body>
</html>
